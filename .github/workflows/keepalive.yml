name: keepalive
# Il piano Free di Supabase mette in pausa i progetti dopo 7 giorni senza attività.
# Ogni 3 giorni chiama la funzione pubblica keepalive() (aggiorna solo un orario, nessun dato personale).
on:
  schedule:
    - cron: '17 7 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          for i in 1 2 3; do
            curl -fsS -X POST "https://hfmkuwjnyfnmzosdcbwz.supabase.co/rest/v1/rpc/keepalive" \
              -H "apikey: sb_publishable_VVVNet24fOV6rRiAcb8KCg_11cvvNcg" \
              -H "Content-Type: application/json" -d '{}' && exit 0
            sleep 30
          done
          exit 1
